<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Robert Lazau</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      @font-face { font-family: "Golden Boy Gothic Expanded"; font-weight: 700; font-display: swap; src: url("/fonts/GoldenBoyGothicExpanded-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Golden Boy Gothic"; font-weight: 400; font-display: swap; src: url("/fonts/GoldenBoyGothic-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Golden Boy Gothic Condensed"; font-weight: 700; font-display: swap; src: url("/fonts/GoldenBoyGothicCondensed-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Courier Prime"; font-weight: 700; font-display: swap; src: url("/fonts/CourierPrime-Bold.woff2") format("woff2"); }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ecebe6;
        color: #191a17;
        font-family: "Golden Boy Gothic", ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 560px; }
      img { width: 64px; height: 64px; display: block; margin-bottom: 32px; }
      .slug { display: inline-block; background: #ebb517; color: #191a17; font-family: "Courier Prime", "Courier New", monospace; font-weight: 700; font-size: 15px; padding: 0.35em 0.65em 0.25em; margin: 0 0 20px; }
      h1 { font-family: "Golden Boy Gothic Expanded", "Arial Black", sans-serif; font-weight: 700; font-size: clamp(40px, 9vw, 64px); line-height: 0.95; letter-spacing: -0.01em; margin: 0 0 16px; }
      p { font-size: 17px; line-height: 1.5; color: #4a4b46; margin: 0 0 32px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      a.btn {
        display: inline-block;
        padding: 15px 24px;
        font-family: "Golden Boy Gothic Condensed", "Arial Narrow", sans-serif;
        font-size: 15px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        text-decoration: none;
      }
      .home { background: #ebb517; color: #191a17; }
      .contact { border: 2px solid #191a17; color: #191a17; }
      a.btn:hover, a.btn:focus-visible { background: #191a17; color: #ecebe6; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/gb-sun-solid.svg" alt="Golden Boy Productions" />
      <div class="slug">EXT. NOWHERE - NIGHT</div>
      <h1>Page not found.</h1>
      <p>That page doesn't exist, or it has moved.</p>
      <div class="actions">
        <a class="btn home" href="/">Go to homepage</a>
        <a class="btn contact" href="/contact">Contact Robert</a>
      </div>
    </main>
  </body>
</html>
