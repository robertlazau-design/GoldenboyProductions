<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Robert Lazau</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060606;
        color: #e5e5e5;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 72px; height: 72px; margin-bottom: 28px; }
      h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 400; font-size: 40px; margin: 0 0 8px; color: #fff; }
      .sub { font-family: Georgia, serif; font-style: italic; color: #dfb86c; font-size: 18px; margin: 0 0 20px; }
      p { font-size: 15px; color: #a3a3a3; margin: 0 0 32px; letter-spacing: 0.02em; }
      .actions { display: flex; flex-direction: column; gap: 12px; max-width: 280px; margin: 0 auto; }
      a.btn {
        display: block;
        padding: 15px 24px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        text-decoration: none;
      }
      .home { background: #dfb86c; color: #060606; }
      .contact { border: 1px solid rgba(223, 184, 108, 0.4); color: #dfb86c; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-mark-small.png" alt="Golden Boy Productions" />
      <h1>Page not found</h1>
      <p class="sub">Golden Boy Productions</p>
      <p>That page doesn't exist, or it has moved.</p>
      <div class="actions">
        <a class="btn home" href="/">Go to homepage</a>
        <a class="btn contact" href="/contact">Contact Robert</a>
      </div>
    </main>
  </body>
</html>
